[project]
name = "lazy-lands-api"
version = "0.1.0"
description = "FastAPI scaffold for Lazy Lands"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "python-dotenv>=1.2.0",
  "pyjwt[crypto]>=2.13.0",
  "supabase>=2.25.0",
  "uvicorn[standard]>=0.38.0",
  "jinja2>=3.1.6",
  "weasyprint>=66.0",
  "markdown-it-py>=3.0.0",
  "nh3>=0.2.18",
]

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "psycopg>=3.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
  "syrupy>=4.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "SIM", "C4", "PIE", "RET", "TID", "PT", "RUF"]
# `×` (U+00D7) is deliberate multiplication notation in a couple of docstrings
# (e.g. "SELECT/INSERT/UPDATE/DELETE × 6 tables"); don't flag it as a confusable.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# D: docstrings aren't required in tests.
# SIM117: nested `with as_user(...)` / `with pytest.raises(...)` blocks read
# clearer than a combined context manager in the RLS tests (which also need a
# live Postgres, so they aren't exercised by CI).
"tests/**/*.py" = ["D", "SIM117"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "dev_inference: opt-in real-LLM prompt/JSON-contract validation; excluded from default CI",
]
