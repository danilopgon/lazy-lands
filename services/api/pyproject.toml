[project]
name = "lazy-lands-api"
version = "0.1.0"
description = "FastAPI scaffold for Lazy Lands"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.124.0",
  "httpx>=0.28.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "python-dotenv>=1.2.0",
  "pyjwt[crypto]>=2.13.0",
  "supabase>=2.25.0",
  "uvicorn[standard]>=0.38.0",
  "jinja2>=3.1.6",
  "weasyprint>=66.0",
]

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "psycopg>=3.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
  "syrupy>=4.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "dev_inference: opt-in real-LLM prompt/JSON-contract validation; excluded from default CI",
]
