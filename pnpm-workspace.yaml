packages:
  - 'apps/*'
  - 'services/*'
  - 'supabase'
# Pin TypeScript to the version the committed lockfile resolved. The web app
# depends on `typescript: latest`, which now floats to 7.x — a major that
# @typescript-eslint 8.x cannot parse (ESLint crashes). Pin it here so installs
# stay reproducible and lint keeps working.
overrides:
  typescript: '6.0.3'
  # Security advisories whose vulnerable package has no direct dependent here to
  # bump. Each range is the advisory's own patched range, and each carries an
  # upper bound on purpose: an open-ended range floats to the newest major, which
  # is how a first attempt at this silently put js-yaml 5 under an ESLint that
  # wants 4. Drop an entry once every dependent ships the fix itself.
  #
  # `minimatch` is here for `brace-expansion`, not for itself. The advisory
  # covering brace-expansion (GHSA-mh99-v99m-4gvg) declares every version up to
  # 5.0.7 vulnerable and publishes the fix only in 5.0.8, so the 1.x line ESLint
  # pulls through `minimatch@3` has no patched release at all. `minimatch@3`
  # cannot take 5.0.8 either — it calls brace-expansion as a bare function, which
  # only the 1.x line exports, and blows up with "expand is not a function".
  # ESLint 9.39.5 and `@eslint/eslintrc` still depend on `minimatch@^3.1.5`
  # upstream, so the only way out of that corner is to lift minimatch itself to
  # the line that consumes a patched brace-expansion. ESLint destructures
  # `{ Minimatch }`, which both majors export, so this holds.
  minimatch: '>=10.2.4 <11'
  brace-expansion: '>=5.0.8 <6'
  js-yaml: '>=4.3.0 <5'
  postcss: '>=8.5.18 <9'
  sharp: '>=0.35.0 <0.36'
# pnpm 11 fails installs on dependencies with un-decided build scripts. These
# native optional deps already ran un-built under pnpm 10 (CI was green without
# them), so keep them un-built and record the decision explicitly to satisfy the
# strict gate. Flip an entry to `true` only if its native build becomes needed.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  sharp: false
  unrs-resolver: false
