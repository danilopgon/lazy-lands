name: Deploy Supabase migrations

# Applies pending schema migrations to the hosted Supabase project.
# Triggers only when migration files land on main, so app-only changes never
# touch the production database. Gated by the `production` environment: configure
# required reviewers on it (Settings -> Environments) to keep human approval in
# the loop before any hosted schema change is applied.

on:
  # Manual trigger so a maintainer can deploy pending migrations on demand
  # (e.g. when the migration files already landed on main via a merged PR and
  # no further migration change will re-fire the push trigger).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

# Never let two migration deploys race against the same hosted database.
concurrency:
  group: supabase-migrations-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        # supabase/setup-cli publishes only exact version tags (no moving v1/v2/v3
        # major tag), so the action ref must be a full release like v2.1.1.
        uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.109.0

      # config.toml sets auth.signing_keys_path, and the CLI eagerly reads that
      # file whenever it parses config (db push, link, even gen signing-key). The
      # key is a local-dev-only artifact, correctly gitignored, so it never
      # reaches CI and db push dies with "failed to read signing keys". Bootstrapping
      # it with the CLI is circular (gen also parses config and needs the file
      # first). A remote migration push has no business needing local auth signing
      # keys, so strip the line from the checked-out config only. This does not
      # touch the committed file or local dev; auth just falls back to its default.
      - name: Drop local-only signing keys path from config (CI checkout only)
        run: sed -i '/^signing_keys_path/d' supabase/config.toml

      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # Passing SUPABASE_DB_PASSWORD via env is required: without it the CLI
      # silently prompts for input and exits 0 without pushing anything.
      - name: Verify pending migrations (dry run)
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push
